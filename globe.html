<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ADYRA OrbitGuard</title>

    <!-- Cesium -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js"></script>

    <link
        href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css"
        rel="stylesheet"
    >

    <style>

        html,
        body,
        #cesiumContainer {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #000;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =========================================
           INFORMATION PANEL
           ========================================= */

        #infoPanel {

            position: absolute;

            top: 18px;
            left: 18px;

            z-index: 100;

            min-width: 250px;

            padding: 16px 18px;

            border-radius: 14px;

            background:
                rgba(4, 12, 28, 0.88);

            border:
                1px solid
                rgba(53, 213, 245, 0.35);

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.45);

            backdrop-filter:
                blur(12px);

            color: white;
        }


        #title {

            font-size: 18px;

            font-weight: 700;

            color: #35D5F5;

            margin-bottom: 10px;
        }


        #satelliteName {

            font-size: 15px;

            font-weight: 600;

            margin-bottom: 10px;

            color: #ffffff;
        }


        .dataRow {

            font-size: 13px;

            color: #B9C8E5;

            margin-top: 6px;
        }


        .value {

            color: #ffffff;

            font-weight: 600;
        }


        /* =========================================
           LEGEND
           ========================================= */

        #legend {

            position: absolute;

            bottom: 25px;
            left: 18px;

            z-index: 100;

            background:
                rgba(4, 12, 28, 0.85);

            border:
                1px solid
                rgba(53, 213, 245, 0.25);

            border-radius: 12px;

            padding: 12px 15px;

            color: white;

            font-size: 12px;
        }


        .legendItem {

            margin: 6px 0;
        }


        .legendDot {

            display: inline-block;

            width: 10px;
            height: 10px;

            border-radius: 50%;

            margin-right: 8px;

            padding: 18px 25px;

    </style>

</head>


<body>


<!-- =============================================
     CESIUM CONTAINER
     ============================================= -->

<div id="cesiumContainer"></div>


<!-- =============================================
     LOADING
     ============================================= -->

<div id="loading">
    🌍 Loading Earth...
</div>


<!-- =============================================
     SATELLITE INFORMATION
     ============================================= -->

<div id="infoPanel">

    <div id="title">
        🛰️ ADYRA ORBITGUARD
    </div>

    <div id="satelliteName">
        Loading satellite...
    </div>

    <div class="dataRow">
        Latitude:
        <span
            class="value"
            id="latitude"
        >
            --
        </span>
    </div>

    <div class="dataRow">
        Longitude:
        <span
            class="value"
            id="longitude"
        >
            --
        </span>
    </div>

    <div class="dataRow">
        Altitude:
        <span
            class="value"
            id="altitude"
        >
            --
        </span>
    </div>

    <div class="dataRow">
        Velocity:
        <span
            class="value"
            id="velocity"
        >
            --
        </span>
    </div>

</div>


<!-- =============================================
     LEGEND
     ============================================= -->

<div id="legend">

    <div class="legendItem">
        <span
            class="legendDot satelliteDot"
        ></span>

        Satellite
    </div>


    <div class="legendItem">
        <span
            class="legendDot groundDot"
        ></span>

        Ground Position
    </div>


    <div class="legendItem">
        <span
            class="legendDot orbitDot"
        ></span>

        Ground Track
    </div>

</div>


<script>


// =================================================
// SATELLITE DATA FROM STREAMLIT
// =================================================
//
// app.py replaces:
//
// __SATELLITE_DATA__
//
// with the real JSON data.
//

const satelliteData =
    __SATELLITE_DATA__;


// =================================================
// CESIUM ION TOKEN
// =================================================
//
// IMPORTANT:
// Replace this with your own Cesium ion token.
//
// Example:
//
// Cesium.Ion.defaultAccessToken =
//     "eyJ....";
//
// Do NOT put your private token in a public GitHub
// repository if you are going to share the project.
// =================================================

Cesium.Ion.defaultAccessToken =
    "YOUR_CESIUM_ION_TOKEN";


// =================================================
// CREATE CESIUM VIEWER
// =================================================

const viewer =
    new Cesium.Viewer(
        "cesiumContainer",
        {

            animation: false,

            timeline: false,

            baseLayerPicker: true,

            geocoder: true,

            homeButton: true,

            sceneModePicker: true,

            navigationHelpButton: false,

            fullscreenButton: false,

            infoBox: false,

            selectionIndicator: false,

            shouldAnimate: true

        }
    );


// =================================================
// REALISTIC EARTH SETTINGS
// =================================================

viewer.scene.globe.show =
    true;


viewer.scene.globe.enableLighting =
    true;


viewer.scene.globe.depthTestAgainstTerrain =
    false;


// =================================================
// ATMOSPHERE
// =================================================

viewer.scene.skyAtmosphere.show =
    true;


viewer.scene.fog.enabled =
    true;


viewer.scene.fog.density =
    0.00015;


// =================================================
// SPACE BACKGROUND
// =================================================

viewer.scene.backgroundColor =
    Cesium.Color.BLACK;


// =================================================
// ENABLE HIGH QUALITY
// =================================================

viewer.scene.postProcessStages.fxaa.enabled =
    true;


// =================================================
// SATELLITE INFORMATION
// =================================================

const satelliteName =
    satelliteData.satellite;


const latitude =
    Number(
        satelliteData.latitude
    );


const longitude =
    Number(
        satelliteData.longitude
    );


const altitude =
    Number(
        satelliteData.altitude
    );


const velocity =
    Number(
        satelliteData.velocity
    );


// =================================================
// UPDATE INFORMATION PANEL
// =================================================

document.getElementById(
    "satelliteName"
).innerText =
    satelliteName;


document.getElementById(
    "latitude"
).innerText =
    latitude.toFixed(4) + "°";


document.getElementById(
    "longitude"
).innerText =
    longitude.toFixed(4) + "°";


document.getElementById(
    "altitude"
).innerText =
    altitude.toFixed(2) + " km";


document.getElementById(
    "velocity"
).innerText =
    velocity.toFixed(3) + " km/s";


// =================================================
// SATELLITE POSITION
// =================================================

const satellitePosition =
    Cesium.Cartesian3.fromDegrees(
        longitude,
        latitude,
        altitude * 1000
    );


// =================================================
// GROUND POSITION
// =================================================

const groundPosition =
    Cesium.Cartesian3.fromDegrees(
        longitude,
        latitude,
        0
    );


// =================================================
// SATELLITE ENTITY
// =================================================

const satelliteEntity =
    viewer.entities.add({

        name:
            satelliteName,

        position:
            satellitePosition,

        point: {

            pixelSize: 18,

            color:
                Cesium.Color.fromCssColorString(
                    "#FFB454"
                ),

            outlineColor:
                Cesium.Color.WHITE,

            outlineWidth: 3,

            heightReference:
                Cesium.HeightReference.NONE

        },

        label: {

            text:
                "🛰️ " +
                satelliteName,

            font:
                "bold 15px Arial",

            fillColor:
                Cesium.Color.WHITE,

            outlineColor:
                Cesium.Color.BLACK,

            outlineWidth: 4,

            style:
                Cesium.LabelStyle
                    .FILL_AND_OUTLINE,

            verticalOrigin:
                Cesium.VerticalOrigin.BOTTOM,

            pixelOffset:
                new Cesium.Cartesian2(
                    0,
                    -28
                ),

            disableDepthTestDistance:
                Number.POSITIVE_INFINITY

        }

    });


// =================================================
// SATELLITE GLOW
// =================================================

viewer.entities.add({

    position:
        satellitePosition,

    point: {

        pixelSize: 40,

        color:
            Cesium.Color.fromCssColorString(
                "#FFB454"
            ).withAlpha(0.18),

        outlineColor:
            Cesium.Color.TRANSPARENT

    }

});


// =================================================
// GROUND POSITION MARKER
// =================================================

viewer.entities.add({

    name:
        "Ground Position",

    position:
        groundPosition,

    point: {

        pixelSize: 10,

        color:
            Cesium.Color.fromCssColorString(
                "#FF5D73"
            ),

        outlineColor:
            Cesium.Color.WHITE,

        outlineWidth: 2

    }

});


// =================================================
// ALTITUDE LINE
// =================================================

viewer.entities.add({

    name:
        "Satellite Altitude",

    polyline: {

        positions:
            Cesium.Cartesian3.fromDegreesArrayHeights(
                [

                    longitude,
                    latitude,
                    0,

                    longitude,
                    latitude,
                    altitude * 1000

                ]
            ),

        width: 3,

        material:
            Cesium.Color.fromCssColorString(
                "#FFB454"
            ).withAlpha(0.75)

    }

});


// =================================================
// GROUND TRACK
// =================================================

const track =
    satelliteData.track || [];


// =================================================
// SPLIT TRACK AT INTERNATIONAL DATE LINE
// =================================================

let segment = [];

let previousLongitude = null;


function drawSegment(
    segmentData
) {

    if (
        segmentData.length < 4
    ) {

        return;

    }


    viewer.entities.add({

        polyline: {

            positions:
                Cesium.Cartesian3
                    .fromDegreesArray(
                        segmentData
                    ),

            width: 3,

            material:
                Cesium.Color.fromCssColorString(
                    "#35D5F5"
                ).withAlpha(0.85),

            clampToGround:
                true

        }

    });

}


// =================================================
// PROCESS TRACK
// =================================================

for (
    let i = 0;
    i < track.length;
    i++
) {

    const point =
        track[i];


    const lat =
        Number(point.lat);


    const lon =
        Number(point.lon);


    if (
        previousLongitude !== null
        &&
        Math.abs(
            lon -
            previousLongitude
        ) > 180
    ) {

        drawSegment(
            segment
        );

        segment = [];

    }


    segment.push(
        lon,
        lat
    );


    previousLongitude =
        lon;

}


// Draw final segment

drawSegment(
    segment
);


// =================================================
// CURRENT POSITION GLOW CIRCLE
// =================================================

viewer.entities.add({

    position:
        groundPosition,

    ellipse: {

        semiMinorAxis:
            50000,

        semiMajorAxis:
            50000,

        material:
            Cesium.Color.fromCssColorString(
                "#FF5D73"
            ).withAlpha(0.12),

        outline:
            true,

        outlineColor:
            Cesium.Color.fromCssColorString(
                "#FF5D73"
            ).withAlpha(0.7),

        height:
            100

    }

});


// =================================================
// CAMERA POSITION
// =================================================

const cameraHeight =
    Math.max(
        2500000,
        altitude * 1000 * 5
    );


viewer.camera.flyTo({

    destination:
        Cesium.Cartesian3.fromDegrees(
            longitude,
            latitude,
            cameraHeight
        ),

    orientation: {

        heading:
            Cesium.Math.toRadians(
                0
            ),

        pitch:
            Cesium.Math.toRadians(
                -45
            ),

        roll:
            0

    },

    duration:
        2.5

});


// =================================================
// REMOVE LOADING
// =================================================

setTimeout(
    function () {

        const loading =
            document.getElementById(
                "loading"
            );

        if (loading) {

            loading.style.display =
                "none";

        }

    },
    1800
);


// =================================================
// DOUBLE CLICK → FOLLOW SATELLITE
// =================================================

viewer.screenSpaceEventHandler.setInputAction(

    function (movement) {

        viewer.camera.flyTo({

            destination:
                Cesium.Cartesian3.fromDegrees(
                    longitude,
                    latitude,
                    Math.max(
                        1000000,
                        altitude * 1000 * 2
                    )
                ),

            duration:
                1.5

        });

    },

    Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK

);


// =================================================
// SATELLITE CLICK
// =================================================

viewer.screenSpaceEventHandler.setInputAction(

    function (click) {

        const picked =
            viewer.scene.pick(
                click.position
            );


        if (
            Cesium.defined(
                picked
            )
            &&
            picked.id ===
                satelliteEntity
        ) {

            viewer.camera.flyTo({

                destination:
                    Cesium.Cartesian3.fromDegrees(
                        longitude,
                        latitude,
                        Math.max(
                            800000,
                            altitude * 1000 * 2
                        )
                    ),

                duration:
                    1.5

            });

        }

    },

    Cesium.ScreenSpaceEventType.LEFT_CLICK

);


// =================================================
// FINISHED
// =================================================

console.log(
    "ADYRA OrbitGuard globe loaded."
);

console.log(
    "Satellite:",
    satelliteName
);

console.log(
    "Latitude:",
    latitude
);

console.log(
    "Longitude:",
    longitude
);

console.log(
    "Altitude:",
    altitude
);

</script>

</body>

</html>
```
